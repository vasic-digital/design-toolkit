# design-toolkit — submodule dependency manifest (§11.4.31)
#
# design-toolkit is a leaf reusable engine: it has ZERO own-org Git
# dependencies and declares NO nested submodules of its own (there is no
# .gitmodules in this repository). It is inherited BY REFERENCE as a depth-1
# submodule under the constitution submodule per the §11.4.28(C) carve-out
# (constitution/submodules/design-toolkit/), and nests no further own-org
# submodules.
#
# §11.4.6 — every field below is DERIVED from the repository as it actually
# stands, never assumed:
#   * ssh_url        — the ONLY remote configured in this WORKING TREE
#                      (`git remote -v` => origin git@github.com:vasic-digital/
#                      design-toolkit.git, fetch + push). That is a fact about
#                      the local remote set and about nothing else: a mirror can
#                      exist on a forge while no local remote points at it, and
#                      that is exactly the case here.
#   * mirrors        — BOTH publication surfaces. Each was verified
#                      INDEPENDENTLY with `git ls-remote` on 2026-09-01:
#                        github.com  main efd2c3f + tags v0.2.0 / v0.2.1 / v0.2.2
#                        gitlab.com  main 520c436 + the same three annotated
#                                    tags, at byte-identical tag and peeled SHAs
#                      ⚠ The two surfaces are ASYMMETRIC and the mirror is STALE.
#                      Both conditions are recorded, not smoothed over:
#                        - GitHub is PUBLIC; the GitLab mirror is PRIVATE.
#                        - The mirror is 3 commits BEHIND. 520c436 is an ancestor
#                          of efd2c3f and ZERO commits exist only on GitLab, so
#                          this is lag, not divergence. No local push URL targets
#                          GitLab, so ordinary pushes do not close the gap.
#                      Syncing the mirror, and changing its visibility, are
#                      OPERATOR decisions. Neither is taken by this manifest.
#   * deps: []       — grep for own-org GitHub URLs across the tree returns only
#                      (a) this repository's OWN url and (b) HelixConstitution,
#                      the PARENT it nests under. Neither is a dependency.
#   * project_agnostic — a census for ATMOSphere-specific literals
#                      (atmosphere|rk3588|rockchip|orange pi) returns ZERO hits
#                      across the tree (control-needled against a known-present
#                      term), so §11.4.28(B)/§11.4.177 hold as stated.
#
# §11.4.6 — THE ABSENCE RULE, and the defect that made it necessary.
# Until 2026-09-01 the ssh_url note above asserted that design-toolkit carried
# no GitLab mirror, "so none is listed here — an unverified mirror would be a
# fabricated entry." Half of that is right and still stands: an unverified
# mirror must NEVER be recorded as EXISTING. It does not license the converse.
# A mirror must not be recorded as ABSENT either. Absence is itself a positive
# claim, and it needs its own positive evidence.
# An unauthenticated probe cannot supply that evidence. Measured 2026-09-01,
# gitlab.com answers a PRIVATE project and a NONEXISTENT one identically —
# 302 -> /users/sign_in from the web, and HTTP 404 from the unauthenticated API.
# The two states are INDISTINGUISHABLE to that instrument, so the only verdict
# it supports is COULD-NOT-DETERMINE, never "no mirror". `git remote -v` does
# not settle it either: it describes this clone, not the forge. An instrument
# that cannot see a thing must not report its absence.
# Only an AUTHENTICATED query separates the two. Re-derive; do not trust:
#     glab api projects/vasic-digital%2Fdesign-toolkit
#     git ls-remote git@gitlab.com:vasic-digital/design-toolkit.git
# The first distinguishes private from nonexistent — an AUTHENTICATED 404 IS
# positive evidence of absence, an unauthenticated one is not. The second
# re-measures the SHAs recorded above without going through any forge API.
schema_version: 1
name: design-toolkit
ssh_url: git@github.com:vasic-digital/design-toolkit.git
mirrors:
  - git@github.com:vasic-digital/design-toolkit.git   # PUBLIC — canonical, main efd2c3f
  - git@gitlab.com:vasic-digital/design-toolkit.git   # PRIVATE — main 520c436, 3 commits behind
language: javascript
language_specific_subtree: true   # the ESM generator code lives under generators/
deps: []                          # zero own-org deps (leaf engine)
transitive_handling:
  recursive: true
  conflict_resolution: operator-required
project_agnostic: true            # §11.4.28(B)/§11.4.177 — carries no project literals
carve_out: "§11.4.28(C) depth-1 reusable engine under constitution/submodules/"

# THIRD-PARTY (non-own-org) package dependencies are OUT of §11.4.31 `deps`
# scope, which enumerates own-org Git SSH dependencies only. They are declared
# and pinned in generators/package.json (15 runtime + 1 optional, all permissive
# MIT/ISC/Apache-2.0/BSD-3, license-verified there) and are installed on demand
# — node_modules/ is NOT vendored in this tree. generators/package.json remains
# the single authority for that set; it is deliberately not duplicated here.
third_party_manifest: generators/package.json
